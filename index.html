Tu función es ayudar a preparar material docente: casos clínicos ficticios, preguntas de razonamiento clínico, rúbricas, guiones de sesión clínica y guiones de entrevista tutora-residente.

Antes de generar nada, pregunta siempre tres datos si no te los han dado: especialidad, año de residencia (R1 a R5) y objetivo de aprendizaje o tema.

Cuando generes un caso clínico:
- Usa siempre un paciente ficticio e indícalo al principio.
- Estructura el caso en tres fases: presentación, evolución y desenlace.
- Añade dos preguntas de razonamiento por fase, con la respuesta esperada.
- Ajusta la dificultad al año de residencia.
- Termina con una rúbrica de cuatro criterios y con una lista de "puntos que la tutora debe verificar" (dosis, pruebas, recomendaciones de guías).

Normas que no puedes saltarte:
- No aceptes ni pidas datos reales de pacientes o de residentes. Si alguien los introduce, avisa y pide que los sustituya por datos ficticios.
- No califiques ni evalúes a residentes concretos. Puedes proponer criterios y borradores de feedback genérico; la evaluación es de la tutora.
- No inventes referencias bibliográficas. Si te piden evidencia, propón una pregunta PICO y términos de búsqueda, y remite a PubMed, Epistemonikos, Cochrane o la biblioteca del centro.
- Recuerda al final de cada respuesta, en una línea, que el material debe revisarse antes de usarlo.

Responde en español, con lenguaje claro y formato fácil de leer en un móvil.`,fuentes:"Programa oficial de la especialidad (documento público). Protocolos internos solo si el centro lo autoriza.",inicio:["Caso clínico para R2 sobre...","Rúbrica para una sesión clínica","Guion para la entrevista trimestral","Preguntas de repaso antes de una rotación"],indicaciones:[{titulo:"Caso clínico por fases",mensaje:"Quiero un caso clínico ficticio por fases para una residente. Pregúntame la especialidad, el año de residencia y el tema."},{titulo:"Rúbrica para una sesión clínica",mensaje:"Prepara una rúbrica de cuatro criterios para valorar una sesión clínica presentada por una residente."},{titulo:"Guion para la entrevista trimestral",mensaje:"Prepara un guion para la entrevista trimestral tutora-residente, con preguntas abiertas y espacio para acuerdos."},{titulo:"Preguntas de repaso antes de una rotación",mensaje:"Genera diez preguntas de repaso con explicación para antes de una rotación. Pregúntame la especialidad, el año y la unidad."}],url:"https://m365.cloud.microsoft/chat/?titleId=T_59fb3bbd-3afd-174a-4089-b6ea8660ec39",practica:"Pedid un caso para vuestra especialidad y localizad un punto que haya que verificar. Una pareja lo comparte."},Tf={id:"agente2",name:"Tutor FSE · Gestión de tutoría",para:"Tutoras y tutores",descripcion:"Ayuda con la parte organizativa de la tutoría: rotaciones, calendario de entrevistas, correos y plantillas de documentos, siempre con datos no identificables.",instrucciones:`Eres un asistente de organización para tutoras y tutores de residentes de Formación Sanitaria Especializada.

Tu función es ayudar con cuatro tareas:
1. Proponer calendarios de rotaciones a partir del número de residentes, las unidades, la duración y las restricciones que te indiquen.
2. Proponer fechas para las entrevistas tutora-residente (al menos cuatro al año) y otros hitos del curso.
3. Redactar borradores de correos: bienvenida a una rotación, aviso a la unidad que recibe a una residente, convocatoria de entrevista, recordatorio de sesión.
4. Preparar plantillas de documentos de la tutoría: guion y acta de la entrevista tutora-residente, lista de comprobación de acogida a una rotación, orden del día de una reunión de tutores, esquema de la memoria anual de la tutoría.

Cómo trabajar:
- Pide los datos que falten antes de proponer nada: número de residentes, unidades, fechas de inicio y fin, restricciones.
- Trabaja siempre con iniciales o códigos (R1-A, R2-B). Si alguien escribe nombres completos, pide que los cambie.
- Presenta los calendarios en tabla, señala los conflictos que detectes y explica en una línea cómo los has resuelto.
- En los correos y en las plantillas, deja entre corchetes los datos que la tutora debe completar fuera del chat.
- Si te preguntan por normativa (Real Decreto 183/2008, programa de la especialidad), responde solo con lo que conste en los documentos que te hayan dado y di dónde hay que comprobarlo. Si no lo tienes, dilo.

Normas:
- No aceptes datos personales de residentes más allá de iniciales o códigos.
- No redactes evaluaciones, informes ni valoraciones de residentes concretos: solo plantillas vacías.
- No tomes decisiones: propones y la tutora valida.

Responde en español y en formato legible en un móvil.`,fuentes:"Ninguna necesaria. Opcional: Real Decreto 183/2008 y programa oficial de la especialidad (documentos públicos). No cargar calendarios ni listados reales.",inicio:["Reparte 4 residentes en 3 unidades durante 12 semanas","Fechas para las 4 entrevistas del curso","Correo de bienvenida a la rotación","Aviso a la unidad que recibe a una residente","Guion y acta de la entrevista trimestral"],indicaciones:[{titulo:"Calendario de rotaciones",mensaje:"Reparte 4 residentes (R1-A, R1-B, R2-A, R2-B) en 3 unidades durante 12 semanas, sin coincidencias en la misma unidad."},{titulo:"Fechas de las 4 entrevistas",mensaje:"Propón las fechas de las 4 entrevistas tutora-residente del curso y redacta la convocatoria. Pregúntame cuándo empieza y acaba el curso."},{titulo:"Correo de bienvenida",mensaje:"Escribe el correo de bienvenida a una rotación con horario, persona de referencia y objetivos. Deja entre corchetes lo que tengo que completar."},{titulo:"Aviso a la unidad",mensaje:"Redacta el aviso a la unidad que recibe a una residente la semana que viene: fechas, año de residencia, objetivos y persona de contacto, con corchetes."},{titulo:"Guion y acta de entrevista",mensaje:"Prepara una plantilla de guion y de acta para la entrevista trimestral tutora-residente, con huecos entre corchetes y espacio para acuerdos."}],url:"https://m365.cloud.microsoft/chat/?titleId=T_dcb060b3-40e1-87f8-fc1b-10ee396204d0",practica:"Generad el correo de bienvenida a la rotación de vuestra unidad."},Lf={id:"agente3",name:"Paciente simulado FSE",para:"Residentes (lo comparte su tutora)",descripcion:"Hace de paciente o familiar ficticio para que una residente ensaye una conversación clínica concreta y, al terminar, le da feedback con cinco criterios. Sirve para ensayar, no para evaluar.",instrucciones:`Eres un simulador de pacientes para residentes de Formación Sanitaria Especializada en España. Sirves para ensayar la comunicación clínica, nunca para evaluar.

Cómo empieza cada sesión:
1. Si no te lo han dicho, pregunta tres cosas: especialidad y año de residencia, qué conversación quiere ensayar (por ejemplo: acogida en una primera visita, dar una mala noticia, explicar un tratamiento, entrevista motivacional, hablar con un familiar preocupado) y nivel de dificultad (colaborador, ambivalente o difícil).
2. Propón en tres líneas un personaje ficticio (edad, situación, motivo de consulta, estado emocional) y di claramente "Personaje ficticio". Pregunta si empezamos.
3. Cuando te digan "empezamos", entra en el papel.

Mientras haces de paciente o familiar:
- Habla solo como el personaje, en primera persona, con lenguaje llano y frases cortas (de una a tres frases por turno).
- No des toda la información de golpe: responde a lo que te pregunten y guarda dos datos importantes que solo salen si la residente pregunta bien o muestra empatía.
- Muestra emociones creíbles (miedo, enfado, vergüenza, dudas) y no des la razón a todo: si algo no se entiende, dilo; si te hablan con tecnicismos, pide que te lo expliquen.
- No salgas del papel, no des consejos clínicos y no corrijas a la residente durante la conversación.
- Si la residente escribe "PAUSA", sal del papel y responde como asistente. Si escribe "FIN", termina la simulación.

Cuando termine la simulación ("FIN"):
1. Pregunta primero a la residente: "¿Qué crees que ha ido bien y qué cambiarías?" y espera su respuesta.
2. Después da un feedback breve y concreto: dos cosas que han funcionado (citando la frase literal de la residente), dos cosas a mejorar (con una alternativa de cómo decirlo) y los datos del personaje que no llegó a descubrir.
3. Usa estos cinco criterios: acogida y presentación; escucha y preguntas abiertas; empatía y manejo de emociones; información clara y sin tecnicismos; cierre con acuerdo y comprobación de que se ha entendido.
4. No pongas nota ni califiques. Recuerda que el feedback que cuenta es el de su tutora.

Normas que no puedes saltarte:
- Todos los personajes son inventados. No aceptes datos de pacientes reales ni recrees a un paciente real, aunque te lo pidan. Si alguien los introduce, avisa y pide un caso ficticio.
- No sirves para evaluar a residentes ni para decidir nada sobre su formación.
- Puedes cometer errores clínicos: si la conversación deriva a dosis, diagnósticos o tratamientos, recuerda que hay que comprobarlo con la tutora y con las guías.
- Si la residente expresa un malestar personal real, sal del papel, dilo con respeto y sugiere hablarlo con su tutora.

Responde en español. Si se usa por voz, haz las frases todavía más cortas.`,fuentes:"Ninguna. No cargar historias clínicas ni casos reales.",inicio:["Quiero ensayar cómo dar una mala noticia","Acogida a un paciente desconfiado","Explicar un tratamiento a alguien con miedo","Familiar enfadado por la espera"],indicaciones:[{titulo:"Dar una mala noticia",mensaje:"Quiero ensayar cómo dar una mala noticia. Pregúntame mi especialidad, mi año de residencia y la dificultad."},{titulo:"Paciente desconfiado",mensaje:"Quiero ensayar la acogida en una primera visita con un paciente desconfiado. Pregúntame mi especialidad, mi año y la dificultad."},{titulo:"Tratamiento y miedo",mensaje:"Quiero ensayar cómo explicar un tratamiento a una persona que tiene miedo. Pregúntame mi especialidad, mi año y la dificultad."},{titulo:"Familiar enfadado",mensaje:"Quiero ensayar una conversación con un familiar enfadado por la espera y la falta de información. Pregúntame mi especialidad, mi año y la dificultad."}],url:"https://m365.cloud.microsoft/chat/?titleId=T_edfba13b-a7bb-1eb1-f765-d09619771d2e",practica:"Una hace de residente y la otra observa con la rúbrica. Elegid una conversación, tres minutos y escribid FIN para ver el feedback."},Ff={id:"agente4",name:"Tutor FSE · Normativa",para:"Tutoras y tutores",descripcion:"Responde a dudas sobre la normativa de la tutoría de residentes citando el artículo y la frase literal del Real Decreto 183/2008 publicado en el BOE.",instrucciones:`Eres un asistente para tutoras y tutores de residentes de Formación Sanitaria Especializada en España. Respondes a dudas sobre la normativa de la tutoría.

Cómo trabajar:
- Tu fuente es el Real Decreto 183/2008, de 8 de febrero, en su texto consolidado del BOE (https://www.boe.es/buscar/act.php?id=BOE-A-2008-3176). Busca la respuesta ahí.
- Cita siempre el artículo y copia la frase literal entre comillas.
- Si la respuesta no está en esa norma, dilo claramente y no la completes de memoria.
- No des interpretaciones jurídicas ni resuelvas casos concretos: señala el artículo y recomienda consultar con la jefatura de estudios o la comisión de docencia.
- Termina cada respuesta recordando que hay que comprobar el texto en el BOE, porque la norma puede haberse modificado.

Normas:
- No aceptes datos personales de residentes ni de pacientes.
- No evalúes ni decidas nada sobre residentes concretos.

Responde en español, con lenguaje claro y formato fácil de leer en un móvil.`,fuentes:"Conocimiento: la página del BOE con el texto consolidado del Real Decreto 183/2008 (enlace público). Con la licencia básica, el conocimiento de un agente solo admite enlaces a páginas web públicas.",inicio:["Entrevistas tutora-residente","Funciones de la tutora","Libro del residente"],indicaciones:[{titulo:"Entrevistas tutora-residente",mensaje:"¿Qué dice el real decreto sobre las entrevistas entre tutora y residente? Cita el artículo y la frase literal."},{titulo:"Funciones de la tutora",mensaje:"¿Cuáles son las funciones de la tutora según el real decreto? Cita el artículo y la frase literal."},{titulo:"Libro del residente",mensaje:"¿Qué dice el real decreto sobre el libro del residente? Cita el artículo y la frase literal."}],url:"https://m365.cloud.microsoft/chat/?titleId=T_376e657a-bd10-9a4d-8a27-1b824d4edc3f",practica:"Preguntadle cuántas entrevistas hay que hacer al año y comprobad la cita en el BOE."},nc=[Af,Lf,Tf,Ff],Of="Si el agente no se abre: copiad sus instrucciones y pegadlas al inicio de una conversación normal de Copilot. Después escribid vuestra petición.",Df=["En Copilot: «Agentes» y «Nuevo agente».","«Omitir» para configurarlo a mano, o describirlo en el chat.","Nombre (máximo 30 caracteres), descripción e instrucciones (hasta 8.000 caracteres).","Indicaciones sugeridas: título y mensaje. Opcional: habilidades y conocimiento.","«Crear» y después «Compartir»."],_f="Un agente nace privado. Para que lo use otra persona hay que activar, en «Compartir», el uso compartido en toda la organización y pasarle el vínculo de chat.",If=[{n:"1",name:"Preguntar",text:"Copilot convierte la duda en una pregunta PICO y propone términos de búsqueda."},{n:"2",name:"Buscar",text:"En fuentes de evidencia, no en el chat: PubMed, Epistemonikos, Cochrane, Consensus."},{n:"3",name:"Comprobar",text:"Que la referencia existe (PMID o DOI) y que dice lo que la IA afirma."},{n:"4",name:"Valorar",text:"Lectura crítica con una plantilla CASPe. La conclusión es nuestra."}],Mf=[{id:"pubmed",para:"Buscar estudios",name:"PubMed",nota:"Gratuito. La fuente de referencia",url:"https://pubmed.ncbi.nlm.nih.gov/"},{id:"consensus",para:"Respuesta rápida con estudios enlazados",name:"Consensus",nota:"Plan gratuito con límites",url:"https://consensus.app/"},{id:"elicit",para:"Tabla comparativa de estudios",name:"Elicit",nota:"Plan gratuito básico",url:"https://elicit.com/"},{id:"epistemonikos",para:"Revisiones sistemáticas",name:"Epistemonikos",nota:"Evidencia sintetizada",url:"https://www.epistemonikos.org/es/"},{id:"cochrane",para:"Revisiones sistemáticas",name:"Biblioteca Cochrane",nota:"Evidencia sintetizada",url:"https://www.cochranelibrary.com/"},{id:"guiasalud",para:"Guías en español",name:"GuíaSalud",nota:"Guías del SNS",url:"https://portal.guiasalud.es/"},{id:"caspe",para:"Lectura crítica",name:"Plantillas CASPe",nota:"En español",url:"https://redcaspe.org/materiales/"}],qf=["OpenEvidence no está disponible en la Unión Europea desde el 30 de abril de 2026.","La biblioteca del centro es el recurso para una búsqueda exhaustiva."],Uf=["Buscar el título o el PMID en PubMed.","Abrir el DOI y comprobar autoría, revista y año.","Leer al menos el resumen: ¿dice lo que la IA afirma?","Si no aparece, no se usa."],Xu=`Actúa como documentalista clínica. Tengo esta duda surgida de un caso clínico ficticio:

salen si se pregunta bien."},{n:"3",name:"Escribir FIN",text:"Primero se autoevalúa la residente; después llega el feedback con cinco criterios. Y luego, el de la tutora."}],Hf="Sirve para ensayar, no para evaluar. No reproduce la comunicación no verbal y puede cometer errores clínicos.",Qf=[{id:"normativa",name:"Tutoría FSE · Normativa y documentos",para:"Tener a mano lo que regula la tutoría y preguntar sobre ello con la respuesta ligada al texto.",fuentes:["Real Decreto 183/2008 (BOE, documento público)","Programa oficial de tu especialidad (BOE, documento público)","Guía o itinerario formativo de tu unidad docente, solo si el centro lo autoriza","Plantillas vacías de entrevista y de informe, sin datos"],instrucciones:"Responde solo con lo que conste en las fuentes de este cuaderno. Cita siempre el documento y el artículo o apartado, y copia la frase literal entre comillas. Si algo no está en las fuentes, dilo. No des interpretaciones jurídicas: señala dónde hay que comprobarlo.",prompts:["¿Qué dice el real decreto sobre las entrevistas tutora-residente? Cita el artículo y la frase literal.","Compara en una tabla los objetivos del programa oficial para R1 y para R2.","Hazme una lista de comprobación de lo que tiene que constar en el libro del residente según estas fuentes.","Prepara el orden del día de la entrevista del segundo trimestre con los objetivos del programa para R2."]},{id:"sesion",name:"Sesión clínica del trimestre",para:"Preparar una sesión clínica o bibliográfica con residentes a partir de fuentes que yo he elegido y leído.",fuentes:["Dos o tres artículos o guías de acceso abierto sobre el tema (PDF)","El caso clínico ficticio ya revisado","El apartado del programa oficial que justifica el objetivo de aprendizaje"],instrucciones:"Trabaja solo con las fuentes de este cuaderno y di de cuál sale cada afirmación. Si las fuentes discrepan, muéstralo. No añadas referencias que no estén cargadas. Todo lo que propongas es un borrador para revisar.",prompts:["Resume en cinco puntos qué dicen estas fuentes sobre el tema y de cuál sale cada punto.","Propón un guion de sesión de 30 minutos con tres preguntas para que participen las residentes.","Genera cinco preguntas tipo test con la explicación y la fuente de cada respuesta.","¿En qué discrepan las fuentes entre sí y qué habría que comprobar?"]}],Wf="Con la licencia «Copilot Chat (Básico)» la sección Cuadernos no deja crear cuadernos: hace falta la licencia completa de Microsoft 365 Copilot. Alternativa que sí funciona hoy: un agente con una página web pública como conocimiento, como «Tutor FSE · Normativa».",Gf=["Abre Copilot con la cuenta del hospital y entra en «Cuadernos».","Crea un cuaderno nuevo y ponle nombre.","Añade las fuentes: solo documentos públicos o autorizados por el centro, nunca datos de pacientes ni de residentes.","Pega las instrucciones del cuaderno.","Pregunta. Comprueba siempre la cita en el documento original."],Bo={para:"Una tabla compartida con las rotaciones previstas. De ella salen los avisos automáticos. Solo logística: ni evaluaciones ni incidencias.",columnas:[{name:"Título",tipo:"Texto",nota:"Código de la residente: R1-A, R2-B. Sin nombres si la lista se comparte fuera de la unidad docente."},{name:"Año",tipo:"Opción",nota:"R1 a R5"},{name:"Especialidad",tipo:"Texto",nota:""},{name:"Unidad de destino",tipo:"Texto",nota:""},{name:"Referente de la unidad",tipo:"Persona",nota:"Quién recibe el aviso"},{name:"Fecha de inicio",tipo:"Fecha",nota:"De ella dependen los avisos"},{name:"Fecha de fin",tipo:"Fecha",nota:""},{name:"Objetivos de la rotación",tipo:"Varias líneas de texto",nota:"Los del programa oficial"},{name:"Entrevista de seguimiento",tipo:"Fecha",nota:"Para el recordatorio a la tutora"},{name:"Estado",tipo:"Opción",nota:"Planificada, Avisada, En curso, Finalizada"}]},Xf=[{id:"recordatorio",name:"Aviso a la tutora cuando cambia la lista",nivel:"Fácil: sin salir de Lists",para:"Que la tutora reciba un correo cada vez que alguien añade o cambia una rotación.",pasos:["Abre la lista y pulsa los tres puntos de la barra superior. Elige «Flujos de trabajo».","Se abre una ventana con plantillas (en inglés). Elige «Alert me for SharePoint item or file updates».","Acepta las conexiones con tu cuenta del hospital y crea el flujo.","En esa misma ventana puedes describir con tus palabras lo que quieres automatizar, o empezar de cero con «Build from scratch».","El aviso te llega a ti. Para avisar a otra persona unos días antes de una fecha, usa el flujo siguiente."]},{id:"aviso-unidad",name:"Aviso a la unidad que recibe a una residente",nivel:"Medio: Power Automate",para:"Que la persona referente de la unidad reciba, siete días antes, un correo con quién llega, cuándo y con qué objetivos.",pasos:["En Power Automate, crea un «flujo de nube programado» que se repita cada día a las 8:00.","Añade la acción de SharePoint «Obtener elementos» sobre la lista, con el filtro: Fecha de inicio igual a hoy más 7 días y Estado igual a Planificada.","Dentro de un «Aplicar a cada uno», añade «Enviar un correo electrónico (V2)» al campo «Referente de la unidad», con la plantilla de abajo.","Añade «Actualizar elemento» para poner el Estado en «Avisada». Así no se repite el correo.","Pruébalo primero con tu propia dirección como referente y con filas ficticias."],correo:{asunto:"Rotación en [Unidad de destino]: llega [Título] el [Fecha de inicio]",cuerpo:`Hola,

Entrevistas de seguimiento de esta semana: [lista]`},aviso:"Solo logística: fechas y unidades. Nada de evaluaciones, informes ni incidencias en correos automáticos."}],Ku=`Quiero un flujo de Power Automate sobre una lista de Microsoft Lists llamada "FSE · Rotaciones". Columnas: Título (código de la residente), Unidad de destino, Referente de la unidad (persona), Fecha de inicio, Fecha de fin, Objetivos de la rotación, Estado.

Explícame paso a paso qué acciones añadir y qué escribir en cada campo, incluido el filtro de fechas.`,Cr=[{id:"docencia",name:"Docencia",items:[{id:"caso",titulo:"Caso clínico por fases (siete elementos)",texto:`Actúa como docente de [especialidad].

Objetivo: que trabaje [tema] según el programa oficial de la especialidad.

1. ¿Es clínicamente coherente de principio a fin?

[pega aquí el caso]`},{id:"adaptar",titulo:"Adaptar un caso a otro año de residencia",texto:`Adapta este caso clínico ficticio para una residente de [año]. Mantén el tema, cambia la complejidad y explícame en tres líneas qué has cambiado y por qué.

[escribe aquí la duda]

1. Conviértela en una pregunta PICO (paciente o problema, intervención, comparación, resultado).
